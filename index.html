<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini Paint p5.js</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>

<body>
  <div class="app">
    <aside>
      <h1>Mini Paint</h1>
      <h2>Alat bentuk</h2>
      <div id="tools" class="grid"></div>
      <p id="hint"></p>

      <h2>Gambar</h2>
      <label class="btn">Muat gambar dari file…<input type="file" id="file" accept="image/*" hidden></label>

      <h2>Warna (flat)</h2>
      <div class="row"><label for="fillC">Isi</label><input type="color" id="fillC" value="#f08c00"><label><input
            type="checkbox" id="noFill"> tanpa isi</label></div>
      <div class="row"><label for="strokeC">Garis</label><input type="color" id="strokeC" value="#22221f"></div>
      <div class="row"><label for="sw">Tebal</label><input type="range" id="sw" min="1" max="20" value="3"><output
          id="swo">3</output></div>

      <h2>Transformasi objek</h2>
      <p id="info">Pilih objek dengan alat Pilih.</p>
      <div class="row"><label for="rot">Rotasi</label><input type="range" id="rot" min="-180" max="180"
          value="0"><output id="roto">0°</output></div>
      <div class="row"><label for="sxr">Skala X</label><input type="range" id="sxr" min="0.1" max="4" step="0.05"
          value="1"><output id="sxo">1</output></div>
      <div class="row"><label for="syr">Skala Y</label><input type="range" id="syr" min="0.1" max="4" step="0.05"
          value="1"><output id="syo">1</output></div>
      <div class="grid">
        <button id="fh">Balik horizontal</button><button id="fv">Balik vertikal</button>
        <button id="dup">Duplikat</button><button id="front">Ke depan</button>
        <button id="del">Hapus</button><button id="clr">Hapus semua</button>
      </div>
    </aside>
    <main id="cv"></main>
  </div>

  <script src="config.js"></script>
  <script src="shapes.js"></script>
  <script src="render.js"></script>
  <script src="input.js"></script>
  <script src="panel.js"></script>
</body>

</html>
